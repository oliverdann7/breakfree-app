name: Functions CI

on:
  push:
    branches: [main]
    paths: ['functions/**']
  pull_request:
    paths: ['functions/**']

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx --yes audit-ci@7.1.0 --config audit-ci.jsonc
      - run: npm run lint
      - run: npm run test:coverage
